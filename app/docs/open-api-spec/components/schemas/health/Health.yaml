type: object
additionalProperties: false
properties:
  status:
    type: string
    enum: [UP, DOWN]
    description: |
      Overall health status of the service
  startedAt:
    type: string
    format: date-time
    description: |
      The date at which the server started
  checks:
    type: object
    properties:
      queue:
        type: string
        enum: [UP, DOWN]
        description: |
          Status of the plugged queue service.
      database:
        type: string
        enum: [UP, DOWN]
        description: |
          Status of the plugged database service.
    required:
      - queue
      - database
required:
  - status
  - startedAt
  - checks
example:
  status: "UP"
  startedAt: "2024-07-15T07:25:55.32Z"
  checks:
    queue: "UP"
    database: "UP"
