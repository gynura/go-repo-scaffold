type: object
additionalProperties: false
properties:
  id:
    type: string
    maxLength: 64
    nullable: true
    description: |
      Unique identifier of the resource inside the app. If not informed when creating a resource, 
      the app will create a UUID
  specificData:
      $ref: '../../_index.yaml#/schemas/UserSpecificData'
example:
  id: "12345abcde67890"
  specificData:
    firstName: Alice
    lastName: Bob
    nickname: AB123
    password: "$2a$10$supersecurepasswordhashed"
    email: alice@bob.com
    country: UK
required:
  - specificData
