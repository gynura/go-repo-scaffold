type: object
nullable: false
description: |
  Metainformation that is shared across all the app's resources
properties:
  id:
    type: string
    maxLength: 64
    nullable: false
    description: Unique identifier of the resource inside the app. If not informed when creating a resource, the app will create a UUID
  createdAt:
    type: string
    format: date-time
    nullable: false
    description: Timestamp when the user was created
  updatedAt:
    type: string
    format: date-time
    nullable: false
    description: Timestamp when the user was last updated
required:
  - id
  - createdAt
  - updatedAt
