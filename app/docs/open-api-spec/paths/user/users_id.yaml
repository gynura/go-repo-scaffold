get:
  operationId: user.users.describe
  tags:
    - User
  summary: Describes a user
  description: Describes the specified user in the path
  parameters:
    - $ref: '../../components/_index.yaml#/parameters/UserId'
  responses:
    '200':
      description: User resource details
      content:
        application/json:
          schema:
            $ref: '../../components/_index.yaml#/schemas/DescribeUser'
    '400':
      $ref: '../../components/_index.yaml#/responses/BadRequestResponse'
    '404':
      $ref: '../../components/_index.yaml#/responses/NotFoundResponse'
    '500':
      $ref: '../../components/_index.yaml#/responses/InternalServerErrorResponse'

put:
  operationId: user.users.edit
  tags:
    - User
  summary: Updates a signer administrator
  description: Updates the specified signer administrator user
  parameters:
    - $ref: '../../components/_index.yaml#/parameters/UserId'
  requestBody:
    description: Information to update the signer administrator user. Missing or empty fields will delete that information
    content:
      application/json:
        schema:
          $ref: '../../components/_index.yaml#/schemas/UpdateUser'
  responses:
    '200':
      description: Administrator user details
      content:
        application/json:
          schema:
            $ref: '../../components/_index.yaml#/schemas/DescribeUser'
    '400':
      $ref: '../../components/_index.yaml#/responses/BadRequestResponse'
    '404':
      $ref: '../../components/_index.yaml#/responses/NotFoundResponse'
    '500':
      $ref: '../../components/_index.yaml#/responses/InternalServerErrorResponse'

delete:
  operationId: user.users.remove
  tags:
    - User
  summary: Removes a user resource
  description: Deletes the specified user in the path
  parameters:
    - $ref: '../../components/_index.yaml#/parameters/UserId'
  responses:
    '200':
      description: Deleted user resource
      content:
        application/json:
          schema:
            $ref: '../../components/_index.yaml#/schemas/DescribeUser'
    '400':
      $ref: '../../components/_index.yaml#/responses/BadRequestResponse'
    '404':
      $ref: '../../components/_index.yaml#/responses/NotFoundResponse'
    '500':
      $ref: '../../components/_index.yaml#/responses/InternalServerErrorResponse'